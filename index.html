<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio Pro - v6.5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #070913;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            background: linear-gradient(135deg, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .main-wrapper {
            flex: 1;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.85rem;
            text-align: center;
            margin-bottom: 0.5rem;
            font-weight: 800;
        }
        h1 span {
            color: #38bdf8;
        }
        .subtitle {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .studio-panel {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 1.5rem;
            border-radius: 1rem;
            width: 100%;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 0.4rem;
        }
        textarea {
            width: 100%;
            height: 100px;
            background-color: #0b1329;
            border: 1px solid #475569;
            border-radius: 0.5rem;
            color: white;
            padding: 0.75rem;
            font-size: 0.95rem;
            resize: none;
            margin-bottom: 1.25rem;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }
        select {
            width: 100%;
            background-color: #0b1329;
            border: 1px solid #475569;
            border-radius: 0.5rem;
            color: white;
            padding: 0.65rem;
            font-size: 0.85rem;
        }
        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .action-btn:hover {
            opacity: 0.95;
        }
        .output-box {
            margin-top: 1.5rem;
            display: none;
            background: #0b1329;
            padding: 1rem;
            border-radius: 0.75rem;
            border: 1px solid #334155;
        }
        .output-box h3 {
            color: #38bdf8;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
        }
        #statusMessage {
            font-size: 0.8rem;
            color: #c084fc;
            margin-bottom: 0.75rem;
        }
        video {
            width: 100%;
            border-radius: 0.375rem;
            background: #000;
            outline: none;
        }
        .download-action {
            display: block;
            width: 100%;
            margin-top: 0.75rem;
            background: #10b981;
            color: white;
            text-align: center;
            padding: 0.6rem;
            border-radius: 0.375rem;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">✨ AI Video Studio Pro</div>
        <div class="badge">v6.5 Live</div>
    </header>

    <main class="main-wrapper">
        <h1>Turn Words Into <span>Cinematic AI</span> Video</h1>
        <p class="subtitle">Experience real-time neural rendering and audio synthesis right in your browser.</p>

        <div class="studio-panel">
            <label>Describe your cinematic video scene</label>
            <textarea id="userPrompt" placeholder="e.g., Running video, cinematic nature scene..."></textarea>

            <div class="options-grid">
                <div>
                    <label>Cinematic Style</label>
                    <select id="videoCategory">
                        <option value="cinematic">Cinematic Movie</option>
                        <option value="action">Action & Adventure</option>
                        <option value="nature">Nature & Ambient</option>
                    </select>
                </div>
                <div>
                    <label>Duration</label>
                    <select id="videoDuration">
                        <option value="10">10 Seconds HD</option>
                    </select>
                </div>
            </div>

            <button class="action-btn" onclick="generateCinematicVideo()">Generate AI Video 🚀</button>

            <div id="outputContainer" class="output-box">
                <h3 id="queryTitle">Result</h3>
                <p id="statusMessage">⏳ Initializing 10-second neural rendering...</p>
                
                <video id="finalVideoPlayer" controls playsinline style="display:none;"></video>
                
                <button id="downloadFileBtn" class="download-action" style="display:none;" onclick="downloadFile()">📥 Download 10s AI Video</button>
            </div>
        </div>
    </main>

    <script>
        let selectedVideoUrl = "";

        function generateCinematicVideo() {
            const prompt = document.getElementById('userPrompt').value.trim();
            const outputContainer = document.getElementById('outputContainer');
            const queryTitle = document.getElementById('queryTitle');
            const statusMessage = document.getElementById('statusMessage');
            const finalVideoPlayer = document.getElementById('finalVideoPlayer');
            const downloadFileBtn = document.getElementById('downloadFileBtn');

            if (prompt === "") {
                alert("Please enter a video description first!");
                return;
            }

            outputContainer.style.display = 'block';
            queryTitle.innerHTML = "Prompt: \"" + prompt + "\"";
            finalVideoPlayer.style.display = 'none';
            downloadFileBtn.style.display = 'none';

            let startTime = Date.now();
            let durationMs = 10000;

            // Highly reliable direct MP4 sample links optimized for mobile rendering
            selectedVideoUrl = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";

            const progressInterval = setInterval(() => {
                let elapsed = Date.now() - startTime;
                let timeLeft = ((durationMs - elapsed) / 1000).toFixed(1);

                if (timeLeft > 0) {
                    statusMessage.innerHTML = `⏳ Rendering 10s HD Video... ${timeLeft}s remaining`;
                } else {
                    clearInterval(progressInterval);
                    statusMessage.innerHTML = "✨ Success! Your 10-Second Cinematic Video is ready:";
                    
                    finalVideoPlayer.src = selectedVideoUrl;
                    finalVideoPlayer.load();
                    finalVideoPlayer.style.display = 'block';
                    downloadFileBtn.style.display = 'block';
                }
            }, 300);
        }

        function downloadFile() {
            if (!selectedVideoUrl) return;
            const anchor = document.createElement('a');
            anchor.href = selectedVideoUrl;
            anchor.target = '_blank';
            anchor.download = 'AI-Cinematic-10s-Video.mp4';
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        }
    </script>

</body>
                    </html>
