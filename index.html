<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio - Text to Video Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            color: #38bdf8;
        }
        .cta-btn {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
        }
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1rem;
        }
        .hero h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        .hero h1 span {
            color: #38bdf8;
        }
        .hero p {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 2rem;
            max-width: 500px;
        }
        .studio-box {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 1.5rem;
            border-radius: 0.75rem;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        textarea {
            width: 100%;
            height: 90px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 0.5rem;
            color: white;
            padding: 0.75rem;
            font-size: 0.95rem;
            resize: none;
            margin-bottom: 1rem;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .output-section {
            margin-top: 1.5rem;
            display: none;
            text-align: left;
            background: #0f172a;
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
        }
        .output-section h3 {
            font-size: 0.95rem;
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }
        .script-box {
            background: #1e293b;
            padding: 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 0.75rem;
            border-left: 3px solid #38bdf8;
        }
        video {
            width: 100%;
            border-radius: 0.375rem;
            margin-top: 0.5rem;
            outline: none;
        }
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e293b;
            padding: 2rem;
            border-radius: 0.75rem;
            width: 90%;
            max-width: 400px;
            border: 1px solid #334155;
            text-align: center;
        }
        .modal-content h2 {
            margin-bottom: 1.5rem;
            color: #38bdf8;
        }
        .modal-content input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 0.375rem;
            color: white;
        }
        .modal-content button {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            border-radius: 0.375rem;
            font-weight: bold;
            cursor: pointer;
        }
        .close-modal {
            margin-top: 1rem;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-block;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎬 AI Studio</div>
        <button class="cta-btn" onclick="openModal()">Sign In</button>
    </header>

    <main class="hero">
        <h1>Transform Text into <span>Stunning Videos</span> with AI</h1>
        <p>Create professional videos with AI voiceover and cinematic scripts from simple prompts.</p>
        
        <div class="studio-box">
            <textarea id="promptInput" placeholder="Try typing: 'horse running', 'water stream', 'war battlefield', or 'Bodo history'..."></textarea>
            <button class="generate-btn" onclick="generateVideo()">Generate AI Video 🚀</button>
            
            <div id="outputSection" class="output-section">
                <h3 id="videoTitle">Generated Result</h3>
                <div class="script-box" id="scriptText">📜 Script & Voiceover: Loading AI script...</div>
                <p id="statusText" style="font-size: 0.85rem; color: #a855f7; margin-bottom: 0.5rem;">⏳ Rendering AI Cinematic Frames...</p>
                
                <video id="aiVideoPlayer" controls style="display:none;" autoplay muted>
                    <source id="videoSource" src="" type="video/mp4">
                    Your browser does not support HTML video.
                </video>
            </div>
        </div>
    </main>

    <!-- Sign In Modal -->
    <div id="signInModal" class="modal">
        <div class="modal-content">
            <h2>Sign In to AI Studio</h2>
            <input type="email" id="emailInput" placeholder="Enter your email">
            <input type="password" id="passInput" placeholder="Enter password">
            <button onclick="handleLogin()">Login / Register</button>
            <span class="close-modal" onclick="closeModal()">Cancel</span>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('signInModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('signInModal').style.display = 'none';
        }

        function handleLogin() {
            const email = document.getElementById('emailInput').value.trim();
            if(email === "") {
                alert("Please enter your email!");
                return;
            }
            alert("Successfully logged in as " + email + "!");
            closeModal();
        }

        function generateVideo() {
            const promptText = document.getElementById('promptInput').value.toLowerCase().trim();
            const outputSection = document.getElementById('outputSection');
            const videoTitle = document.getElementById('videoTitle');
            const scriptText = document.getElementById('scriptText');
            const statusText = document.getElementById('statusText');
            const videoPlayer = document.getElementById('aiVideoPlayer');
            const videoSource = document.getElementById('videoSource');

            if (promptText === "") {
                alert("Please enter a video prompt first!");
                return;
            }

            outputSection.style.display = 'block';
            videoTitle.innerHTML = "Query: \"" + document.getElementById('promptInput').value + "\"";
            statusText.innerHTML = "⏳ AI is synthesizing voiceover and rendering video...";
            videoPlayer.style.display = 'none';

            // Smart keyword matching for different video types
            let selectedVideo = "https://www.w3schools.com/html/mov_bbb.mp4";
            let generatedScript = "AI Voiceover: Cinematic overview of your custom prompt with immersive background sound effects.";

            if (promptText.includes('horse') || promptText.includes('animal')) {
                selectedVideo = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";
                generatedScript = "Voiceover: 'Majestic wild horses gallop freely across the golden plains, driven by raw energy and untamed spirit.' [Cinematic Epic BGM Playing]";
            } else if (promptText.includes('water') || promptText.includes('river') || promptText.includes('sea')) {
                selectedVideo = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4";
                generatedScript = "Voiceover: 'Crystal clear water flows seamlessly through ancient valleys, reflecting the serene beauty of nature.' [Calming Ambient Water Sounds]";
            } else if (promptText.includes('war') || promptText.includes('battle') || promptText.includes('action')) {
                selectedVideo = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4";
                generatedScript = "Voiceover: 'The battlefield echoes with tactical precision and high-stakes drama as history unfolds.' [Intense Action Orchestral BGM]";
            } else if (promptText.includes('bodo') || promptText.includes('history')) {
                selectedVideo = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4";
                generatedScript = "Voiceover: 'Exploring the rich cultural heritage and historical roots of the Bodo community, filled with traditions and legacy.' [Traditional Cinematic Score]";
            } else {
                selectedVideo = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4";
                generatedScript = "Voiceover: 'Generating custom realistic visual representation based on your unique descriptive prompt.' [AI Synthwave Soundscape]";
            }

            setTimeout(() => {
                statusText.innerHTML = "🎉 Success! AI Video & Voiceover Generated:";
                videoSource.src = selectedVideo;
                scriptText.innerHTML = "📜 " + generatedScript;
                videoPlayer.load();
                videoPlayer.style.display = 'block';
                videoPlayer.play();
            }, 2500);
        }
    </script>

</body>
    </html>
