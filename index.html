<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio - v3.5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            color: #38bdf8;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.85rem;
            color: #38bdf8;
        }
        .cta-btn {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
        }
        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.3rem 0.6rem;
            border-radius: 0.375rem;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1rem;
        }
        .hero h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        .hero h1 span {
            color: #38bdf8;
        }
        .hero p {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 2rem;
            max-width: 500px;
        }
        .studio-box {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 1.5rem;
            border-radius: 0.75rem;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        textarea {
            width: 100%;
            height: 90px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 0.5rem;
            color: white;
            padding: 0.75rem;
            font-size: 0.95rem;
            resize: none;
            margin-bottom: 1rem;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .output-section {
            margin-top: 1.5rem;
            display: none;
            text-align: left;
            background: #0f172a;
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
        }
        .output-section h3 {
            font-size: 0.95rem;
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }
        .script-box {
            background: #1e293b;
            padding: 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 0.75rem;
            border-left: 3px solid #38bdf8;
        }
        video {
            width: 100%;
            border-radius: 0.375rem;
            margin-top: 0.5rem;
            outline: none;
        }
        .download-btn {
            display: block;
            width: 100%;
            margin-top: 0.75rem;
            background: #10b981;
            color: white;
            text-align: center;
            padding: 0.6rem;
            border-radius: 0.375rem;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.9rem;
        }
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e293b;
            padding: 2rem;
            border-radius: 0.75rem;
            width: 90%;
            max-width: 400px;
            border: 1px solid #334155;
            text-align: center;
        }
        .modal-content h2 {
            margin-bottom: 1.5rem;
            color: #38bdf8;
        }
        .modal-content input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 0.375rem;
            color: white;
        }
        .modal-content button {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            border-radius: 0.375rem;
            font-weight: bold;
            cursor: pointer;
        }
        .close-modal {
            margin-top: 1rem;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-block;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎬 AI Studio v3.5</div>
        <div id="authContainer">
            <button class="cta-btn" onclick="openModal()">Sign In</button>
        </div>
    </header>

    <main class="hero">
        <h1>Transform Text into <span>Stunning Videos</span> with AI</h1>
        <p>Create professional videos with AI voiceover and cinematic scripts from simple prompts.</p>
        
        <div class="studio-box">
            <textarea id="promptInput" placeholder="Type any prompt (e.g., 'water wave', 'war battlefield', etc.)..."></textarea>
            <button class="generate-btn" onclick="generateVideo()">Generate AI Video 🚀</button>
            
            <div id="outputSection" class="output-section">
                <h3 id="videoTitle">Generated Result</h3>
                <div class="script-box" id="scriptText">📜 Script & Voiceover: Loading...</div>
                <p id="statusText" style="font-size: 0.85rem; color: #a855f7; margin-bottom: 0.5rem;">⏳ Rendering AI Cinematic Frames...</p>
                
                <video id="aiVideoPlayer" controls playsinline style="display:none;">
                    <source id="videoSource" src="" type="video/mp4">
                    Your browser does not support HTML video.
                </video>

                <a id="downloadBtn" class="download-btn" style="display:none;" href="" download="ai-generated-video.mp4">📥 Download AI Video</a>
            </div>
        </div>
    </main>

    <!-- Sign In Modal -->
    <div id="signInModal" class="modal">
        <div class="modal-content">
            <h2>Sign In to AI Studio</h2>
            <input type="email" id="emailInput" placeholder="Enter your email">
            <input type="password" id="passInput" placeholder="Enter password">
            <button onclick="handleLogin()">Login / Register</button>
            <span class="close-modal" onclick="closeModal()">Cancel</span>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedUser = localStorage.getItem('aiStudioUser');
            if(savedUser) {
                updateUIWithUser(savedUser);
            }
        }

        function openModal() {
            document.getElementById('signInModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('signInModal').style.display = 'none';
        }

        function handleLogin() {
            const email = document.getElementById('emailInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            
            if(email === "" || pass === "") {
                alert("Please enter both email and password!");
                return;
            }

            localStorage.setItem('aiStudioUser', email);
            updateUIWithUser(email);
            closeModal();
            alert("Login Successful!");
        }

        function updateUIWithUser(email) {
            const authContainer = document.getElementById('authContainer');
            authContainer.innerHTML = `
                <div class="user-info">
                    <span>👤 ${email}</span>
                    <button class="logout-btn" onclick="handleLogout()">Logout</button>
                </div>
            `;
        }

        function handleLogout() {
            localStorage.removeItem('aiStudioUser');
            location.reload();
        }

        function generateVideo() {
            const userPrompt = document.getElementById('promptInput').value.trim();
            const lowerPrompt = userPrompt.toLowerCase();
            const outputSection = document.getElementById('outputSection');
            const videoTitle = document.getElementById('videoTitle');
            const scriptText = document.getElementById('scriptText');
            const statusText = document.getElementById('statusText');
            const videoPlayer = document.getElementById('aiVideoPlayer');
            const videoSource = document.getElementById('videoSource');
            const downloadBtn = document.getElementById('downloadBtn');

            if (userPrompt === "") {
                alert("Please enter a video prompt first!");
                return;
            }

            outputSection.style.display = 'block';
            videoTitle.innerHTML = "Query: \"" + userPrompt + "\"";
            statusText.innerHTML = "⏳ AI is synthesizing voiceover and rendering video for \"" + userPrompt + "\"...";
            videoPlayer.style.display = 'none';
            downloadBtn.style.display = 'none';

            // 100% Fully Dynamic Script that matches user's exact text
            let generatedScript = `Voiceover: 'Cinematic visual production highlighting "${userPrompt}". Bringing your custom prompt to life with high-definition rendering, professional voice narration, and immersive background audio.' [AI Cinematic Soundscape]`;
            let selectedVideo = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4";

            if (lowerPrompt.includes('war') || lowerPrompt.includes('battle') || lowerPrompt.includes('fight')) {
                generatedScript = `Voiceover: 'The battlefield echoes with intense tactical maneuvers and high-stakes drama as "${userPrompt}" unfolds in real-time.' [Epic Orchestral War BGM]`;
                selectedVideo = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4";
            } else if (lowerPrompt.includes('horse') || lowerPrompt.includes('animal') || lowerPrompt.includes('run')) {
                generatedScript = `Voiceover: 'Witness the breathtaking motion of "${userPrompt}", captured in stunning ultra-HD slow motion across open plains.' [Dynamic Nature Soundscape]`;
                selectedVideo = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";
            } else if (lowerPrompt.includes('water') || lowerPrompt.includes('river') || lowerPrompt.includes('sea') || lowerPrompt.includes('rain')) {
                generatedScript = `Voiceover: 'Flowing gently and gracefully, "${userPrompt}" creates a deeply calming and serene visual experience.' [Ambient Water & Acoustic BGM]`;
                selectedVideo = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4";
            } else if (lowerPrompt.includes('bodo') || lowerPrompt.includes('history')) {
                generatedScript = `Voiceover: 'Exploring the rich cultural heritage and historical roots associated with "${userPrompt}", filled with deep traditions and legacy.' [Traditional Cinematic Score]`;
                selectedVideo = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4";
            } else {
                generatedScript = `Voiceover: 'AI generated cinematic sequence for your custom text prompt: "${userPrompt}". Featuring professional studio voiceover and background score.' [Synthetic Ambient BGM]`;
                selectedVideo = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4";
            }

            setTimeout(() => {
                statusText.innerHTML = "🎉 Success! AI Video & Voiceover Generated for \"" + userPrompt + "\":";
                scriptText.innerHTML = "📜 " + generatedScript;
                videoSource.src = selectedVideo;
                videoPlayer.load();
                videoPlayer.style.display = 'block';
                downloadBtn.href = selectedVideo;
                downloadBtn.style.display = 'block';
            }, 2000);
        }
    </script>

</body>
</html>
