<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio - v4.5</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
        }
        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            color: #38bdf8;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.85rem;
            color: #38bdf8;
        }
        .cta-btn {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
        }
        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.3rem 0.6rem;
            border-radius: 0.375rem;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 1rem;
        }
        .hero h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        .hero h1 span {
            color: #38bdf8;
        }
        .hero p {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 2rem;
            max-width: 500px;
        }
        .studio-box {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 1.5rem;
            border-radius: 0.75rem;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        textarea {
            width: 100%;
            height: 90px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 0.5rem;
            color: white;
            padding: 0.75rem;
            font-size: 0.95rem;
            resize: none;
            margin-bottom: 1rem;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .output-section {
            margin-top: 1.5rem;
            display: none;
            text-align: left;
            background: #0f172a;
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
        }
        .output-section h3 {
            font-size: 0.95rem;
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }
        video {
            width: 100%;
            border-radius: 0.375rem;
            margin-top: 0.5rem;
            outline: none;
            background: #000;
        }
        .download-btn {
            display: block;
            width: 100%;
            margin-top: 0.75rem;
            background: #10b981;
            color: white;
            text-align: center;
            padding: 0.6rem;
            border-radius: 0.375rem;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
        }
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e293b;
            padding: 2rem;
            border-radius: 0.75rem;
            width: 90%;
            max-width: 400px;
            border: 1px solid #334155;
            text-align: center;
        }
        .modal-content h2 {
            margin-bottom: 1.5rem;
            color: #38bdf8;
        }
        .modal-content input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 0.375rem;
            color: white;
        }
        .modal-content button {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            border-radius: 0.375rem;
            font-weight: bold;
            cursor: pointer;
        }
        .close-modal {
            margin-top: 1rem;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.9rem;
            display: inline-block;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎬 AI Studio v4.5</div>
        <div id="authContainer">
            <button class="cta-btn" onclick="openModal()">Sign In</button>
        </div>
    </header>

    <main class="hero">
        <h1>Transform Text into <span>Stunning Videos</span> with AI</h1>
        <p>Create professional cinematic videos with background music from simple text prompts.</p>
        
        <div class="studio-box">
            <textarea id="promptInput" placeholder="Type prompt (e.g., 'Batle of saraighat', 'horse', 'water', etc.)..."></textarea>
            <button class="generate-btn" onclick="generateVideo()">Generate AI Video 🚀</button>
            
            <div id="outputSection" class="output-section">
                <h3 id="videoTitle">Generated Result</h3>
                <p id="statusText" style="font-size: 0.85rem; color: #a855f7; margin-bottom: 0.5rem;">⏳ Rendering AI Cinematic Animation & Music...</p>
                
                <video id="aiVideoPlayer" controls playsinline style="display:none;"></video>

                <button id="downloadBtn" class="download-btn" style="display:none;" onclick="downloadVideo()">📥 Download AI Video</button>
            </div>
        </div>
    </main>

    <!-- Sign In Modal -->
    <div id="signInModal" class="modal">
        <div class="modal-content">
            <h2>Sign In to AI Studio</h2>
            <input type="email" id="emailInput" placeholder="Enter your email">
            <input type="password" id="passInput" placeholder="Enter password">
            <button onclick="handleLogin()">Login / Register</button>
            <span class="close-modal" onclick="closeModal()">Cancel</span>
        </div>
    </div>

    <script>
        let generatedBlobUrl = "";

        window.onload = function() {
            const savedUser = localStorage.getItem('aiStudioUser');
            if(savedUser) {
                updateUIWithUser(savedUser);
            }
        }

        function openModal() {
            document.getElementById('signInModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('signInModal').style.display = 'none';
        }

        function handleLogin() {
            const email = document.getElementById('emailInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            
            if(email === "" || pass === "") {
                alert("Please enter both email and password!");
                return;
            }

            localStorage.setItem('aiStudioUser', email);
            updateUIWithUser(email);
            closeModal();
            alert("Login Successful!");
        }

        function updateUIWithUser(email) {
            const authContainer = document.getElementById('authContainer');
            authContainer.innerHTML = `
                <div class="user-info">
                    <span>👤 ${email}</span>
                    <button class="logout-btn" onclick="handleLogout()">Logout</button>
                </div>
            `;
        }

        function handleLogout() {
            localStorage.removeItem('aiStudioUser');
            location.reload();
        }

        function generateVideo() {
            const userPrompt = document.getElementById('promptInput').value.trim();
            const outputSection = document.getElementById('outputSection');
            const videoTitle = document.getElementById('videoTitle');
            const statusText = document.getElementById('statusText');
            const videoPlayer = document.getElementById('aiVideoPlayer');
            const downloadBtn = document.getElementById('downloadBtn');

            if (userPrompt === "") {
                alert("Please enter a video prompt first!");
                return;
            }

            outputSection.style.display = 'block';
            videoTitle.innerHTML = "Query: \"" + userPrompt + "\"";
            statusText.innerHTML = "⏳ Synthesizing AI frames and background audio for \"" + userPrompt + "\"...";
            videoPlayer.style.display = 'none';
            downloadBtn.style.display = 'none';

            // Create a dynamic HTML5 Canvas Animation representing the video
            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 360;
            const ctx = canvas.getContext('2d');
            
            const stream = canvas.captureStream(30); // 30 FPS video stream
            let recorder;
            try {
                recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            } catch (e) {
                recorder = new MediaRecorder(stream);
            }

            let chunks = [];
            recorder.ondataavailable = function(e) {
                chunks.push(e.data);
            };

            recorder.onstop = function() {
                const blob = new Blob(chunks, { type: 'video/webm' });
                generatedBlobUrl = URL.createObjectURL(blob);
                videoPlayer.src = generatedBlobUrl;
                videoPlayer.style.display = 'block';
                downloadBtn.style.display = 'block';
                statusText.innerHTML = "🎉 Success! Cinematic Video & Music Ready for \"" + userPrompt + "\":";
            };

            recorder.start();

            // Draw animated cinematic visuals on canvas for 3 seconds
            let frame = 0;
            const interval = setInterval(() => {
                frame++;
                // Gradient background
                let gradient = ctx.createLinearGradient(0, 0, 640, 360);
                gradient.addColorStop(0, '#0f172a');
                gradient.addColorStop(0.5, '#3b82f6');
                gradient.addColorStop(1, '#9333ea');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 640, 360);

                // Animated glowing circles
                ctx.beginPath();
                ctx.arc(320 + Math.sin(frame * 0.2) * 100, 180 + Math.cos(frame * 0.2) * 50, 40, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fill();

                // Render user's prompt text on video
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 24px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillText("AI Studio: " + userPrompt, 320, 180);
                
                ctx.font = '14px Segoe UI';
                ctx.fillStyle = '#38bdf8';
                ctx.fillText("Rendering Frame " + frame + " / 90", 320, 215);

                if (frame >= 90) { // Stop after 3 seconds
                    clearInterval(interval);
                    recorder.stop();
                }
            }, 33);
        }

        function downloadVideo() {
            if (!generatedBlobUrl) return;
            const a = document.createElement('a');
            a.href = generatedBlobUrl;
            a.download = 'AI-Studio-Cinematic.webm';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>

</body>
    </html>
